[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprofig"
version = "0.1.0"
description = "Scientific SVG figures with their data, statistics, and provenance built in"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Jamie Malcolm"}]
keywords = ["svg", "provenance", "reproducibility", "scientific-figures", "metadata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jay2owe/ReproFig"
Repository = "https://github.com/Jay2owe/ReproFig"
Issues = "https://github.com/Jay2owe/ReproFig/issues"
Changelog = "https://github.com/Jay2owe/ReproFig/releases"

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.6"]
pandas = ["pandas>=1.5"]
rocrate = ["rocrate>=0.13"]
dev = ["pytest>=8", "build>=1", "pandas>=1.5", "matplotlib>=3.6"]

[project.scripts]
reprofig = "reprofig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
