[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reprofig"
version = "0.4.0"
description = "Verifiable figures with their data, provenance, and optional statistics built in"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Jamie Malcolm"}]
keywords = ["figures", "provenance", "reproducibility", "scientific-figures", "metadata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jay2owe/ReproFig"
Repository = "https://github.com/Jay2owe/ReproFig"
Issues = "https://github.com/Jay2owe/ReproFig/issues"
Changelog = "https://github.com/Jay2owe/ReproFig/releases"

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
proof = [
  "openpyxl>=3.1",
  "scipy>=1.10",
  "Pillow>=10",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "pypdfium2>=4.30",
]
matplotlib = ["matplotlib>=3.6"]
pandas = ["pandas>=1.5"]
rocrate = ["rocrate>=0.13"]
pdf = ["pikepdf>=10"]
pdf-render = ["pypdfium2>=4.30", "Pillow>=10"]
raster = ["Pillow>=10", "tifftools>=1.6"]
heif = ["Pillow>=11.3", "pillow-heif>=1.0"]
hdf5 = ["h5py>=3.10"]
netcdf = ["netCDF4>=1.7", "h5py>=3.10"]
fits = ["astropy>=6"]
all-formats = [
  "pikepdf>=10",
  "Pillow>=11.3",
  "tifftools>=1.6",
  "pillow-heif>=1.0",
  "h5py>=3.10",
  "netCDF4>=1.7",
  "astropy>=6",
]
dev = [
  "pytest>=8",
  "build>=1",
  "twine>=5",
  "openpyxl>=3.1",
  "scipy>=1.10",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "pypdfium2>=4.30",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "pikepdf>=10",
  "Pillow>=11.3",
  "tifftools>=1.6",
  "pillow-heif>=1.0",
  "h5py>=3.10",
  "netCDF4>=1.7",
  "astropy>=6",
]

[project.scripts]
reprofig = "reprofig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
